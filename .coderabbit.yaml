# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit config for the chodeus/smoked-salmon fork.
#
# One-time comprehensive review: a PR of `master` into the `upstream-base` branch
# (pinned at the upstream fork point) surfaces the whole fork delta in a single
# pass. base_branches must list it or CodeRabbit only auto-reviews the default branch.
language: en-US
reviews:
  # assertive: chill passed a diff clean that assertive flagged with two Major findings (2026-09-03); the "**" rule keeps style nits out
  profile: assertive
  request_changes_workflow: false
  pre_merge_checks:
    # off: the 80% docstring-coverage warning contradicts the one-line-docstring rule under "**"
    docstrings:
      mode: "off"
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "^upstream-base$"
      - "^master$"
  path_filters:
    - "!uv.lock"
    - "!**/package-lock.json"
    - "!webui/node_modules/**"
    # webui/static is the gitignored Vite build; web/static is 23 tracked binaries.
    - "!src/salmon/web*/static/**"
    - "!src/salmon/data/version.toml"

  path_instructions:
    - path: "src/salmon/webui/**/*.py"
      instructions: |-
        Web UI — it holds the account's tracker cookies and can trigger real uploads and deletes:
        - The no-token no-op in auth.py is intentional for a loopback/dev bind ONLY. Flag anything that widens reachability without a token: a non-loopback default host, a new 0.0.0.0 bind, a container that exposes the port, or a new entry in EXEMPT_API_PATHS. /api/health is deliberately NOT exempt because it discloses config, directories, binary paths and trackers — keep it that way.
        - Compare tokens with hmac.compare_digest, never ==. Never log, echo or return the token, the session cookie, or tracker cookies on any read path, including error bodies and tracebacks.
        - Fail closed: if config or the token cannot be resolved, reject (401/503) — never fall through to the app. An `except: token = None` branch must deny, not disable the gate.
        - A long-lived token must not travel in a URL (query string, EventSource, <img>) — browser history, referrers and proxy logs retain it.
        - Job state mutated from a request handler needs a lock or an atomic DB write; two concurrent job actions must not interleave into a half-applied state.
    - path: "src/salmon/trackers/**/*.py"
      instructions: |-
        Tracker clients (RED/OPS/DIC) — a mistake here gets the account IP-banned, not just an error:
        - Respect the per-user request budget (RED is 10 requests / 10 seconds) on EVERY new call path, including retries, batch loops and concurrency added in this diff. A new call inside an existing loop silently multiplies the rate.
        - Back off on 429/5xx with the server's Retry-After; never retry immediately in a tight loop, and cap total attempts.
        - Never put an api key, cookie or passkey in a log line, an exception message or a URL that gets logged — HTTP client exceptions embed the full request URL in the traceback.
        - Treat upload/delete as irreversible: confirm the destructive call is gated on an explicit user action, and that a dry-run path cannot fall through to a real POST.
    - path: "src/salmon/sources/**/*.py"
      instructions: |-
        Metadata scrapers (qobuz, tidal, deezer, bandcamp, discogs, musicbrainz, ...):
        - A parser must fail soft: a missing or renamed field returns None and is handled, never raises into the caller mid-upload or writes a partial tag set.
        - Don't cache a transient failure (network/5xx/timeout/rate-limit) as a genuine "not found" — a blip must not suppress a valid answer later.
        - Credentials and region/account entitlements differ per source; never hardcode a token or assume a storefront.
    - path: "Dockerfile"
      instructions: |-
        Container build:
        - Pin the base image by digest and pin apt/pip/uv versions — an unpinned tag silently changes the runtime between builds.
        - Never bake a secret into ARG/ENV or a RUN argv: both persist in image history, and /proc/<pid>/cmdline is world-readable in-container. Inject SALMON_WEB_TOKEN and tracker credentials at runtime.
        - A recursive chown/chmod over a tree a previous COPY wrote re-materialises every file in a new layer, duplicating it in the image — use COPY --chown instead.
        - The runtime stage must not inherit compilers, headers or -dev packages from the builder.
    - path: "pyproject.toml"
      instructions: |-
        Dependency manifest:
        - An extra ([all], [composite], [security]) pulls that extra's whole transitive set — confirm the code path needing it still exists. Deleting a feature must drop its dependency in the same change.
        - A pin whose only justification is dodging a CVE in a transitive dep is a smell: check the consumer is still reachable, then remove the dependency rather than maintain the pin.
        - Build- and test-only packages must not land in the runtime dependency set the image installs.
    - path: "tests/**/*.py"
      instructions: |-
        Test suite:
        - No side-effecting call inside an assert — python -O strips assert statements and the call with them. Bind to a local first, then assert on the local.
        - A guard that cannot fail is worse than none: an assertion reachable only when a list is non-empty, or keyed on a symbol that may be renamed, passes vacuously. Pair it with a control that fails when the defect is injected.
        - Never let a test hit a live tracker or upload endpoint; network must be stubbed. A test that can POST to RED/OPS is an account risk.
    - path: "src/salmon/uploader/**/*.py"
      instructions: |-
        Upload orchestration — the tracker POST is the point of no return:
        - The --dry-run gate (gazelle_site.dry_run -> dry_run_upload + raise
          DryRunComplete) must stay IMMEDIATELY before gazelle_site.upload();
          flag any new code path that reaches upload() without passing it, and
          remember RED's server-side dryrun still POSTs the full upload.
        - shutil.rmtree / send2trash on abort must only ever target the staged
          copy, never a library_dirs source. copytree must keep refusing an
          existing dest and stay a real copy (no hardlinks) so tag writes never
          touch library files.
        - --essential-only and --scene stay mutually exclusive.
    - path: "src/salmon/**/*.py"
      instructions: |-
        Everything else under src/salmon (checks, tagger, converter, images, search, config):
        - Distinguish a genuine not-found from a transient failure (network,
          5xx, timeout, rate limit) — never cache or report a transient as
          "no result", and never let one greenlight an upload.
        - Fail closed on config: a missing or unparseable setting on an upload
          or delete path is an error, not a default.
        - 0 and "" are legitimate values (track numbers, bit depth, disc 0,
          empty tag) — use explicit None checks, not truthiness.
        - Never log or format tracker cookies, API keys, passkeys or session
          tokens, including inside exception messages and URLs.
    - path: "webui/src/**/*.{svelte,ts}"
      instructions: |-
        Svelte web UI:
        - The token is posted once as a JSON body to /api/login and auth then
          rides the session cookie — never put it in a URL, query string,
          WebSocket URL or header on later calls, and never persist it in
          localStorage.
        - checkAuth() fails OPEN on a fetch error by design (loopback/dev); the
          SERVER is the gate. Flag a change that hides a destructive action
          behind that client-side flag alone.
        - 0 and "" are falsy: use ?? / Number.isFinite / explicit null checks
          for counts, sizes and indices.
        - Close WebSockets and clear timers on component destroy.
    - path: ".github/workflows/**"
      instructions: |-
        CI and the GHCR publish:
        - build-pr.yml is the ONLY cover for Dockerfile and webui/ on PRs. A
          green ruff/pyright/pytest set does not prove the image builds (a
          runtime bump once passed every check and broke the image) — keep the
          image build a PR gate.
        - Never add packages: write or registry login to a pull_request workflow;
          a same-repo PR can edit the workflow it runs under. Keep
          persist-credentials: false.
        - Enumerate allowed states positively (== 'success' || == 'skipped'),
          never by negation; pin third-party actions by commit SHA; never
          interpolate untrusted input into `run:` — pass it via env.
    - path: "**"
      instructions: |-
        Applies to every file, whatever the language:
        - Comments are navigational or instructional only and capped at 1-2 lines:
          what a non-obvious block does, or the gotcha it guards. No why/history
          essays, no before/after narrative, no restating the code, no section
          banners. Docstrings: one line unless the signature genuinely cannot
          carry it. Never ask for a docstring to be added; a missing docstring
          is not a finding.
        - The 1-2 line cap wins even inside an already heavily-commented file —
          matching local density is not licence to exceed it.
        - A comment, docstring, help text, column header, log message or UI label
          that disagrees with what the code does is a correctness finding, not a
          stale-comment nit: report it and say which side is wrong.
        - Do not flag stylistic preferences that are consistent across the file
          (naming, quoting, import order, formatting, line length). Report
          correctness, security, data-loss and the classes named above.

  tools:
    # Lint/format/type is already enforced by our CI (ruff + basedpyright); skip here to avoid duplicate noise.
    ruff:
      enabled: false
    gitleaks:
      enabled: true

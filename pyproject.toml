[project]
name = "salmon"
version = "0.10.1"
description = "An uploading script for Gazelle-based music trackers."
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.13.15"
dependencies = [
    "aiohttp>=3.14.3; sys_platform == 'win32'",
    "aiohttp-jinja2>=1.6",
    "aiohttp[speedups]>=3.14.3; sys_platform != 'win32'",
    "aiolimiter>=1.2.1",
    "anyio>=4.15.1",
    "asyncclick>=8.4.2.1",
    "av>=18.1.0",
    "beautifulsoup4[lxml]>=4.15.0",
    "deluge-client>=1.10.2",
    "fastapi>=0.141.1",
    "humanfriendly>=10.0",
    "jinja2>=3.1.6",
    "msgspec[toml]>=0.21.1",
    "musicbrainzngs>=0.7.1",
    "mutagen>=1.48.1",
    "numpy>=2.5.2",
    "openai>=3.8.0",
    "pillow>=12.3.0",
    "platformdirs>=4.11.7",
    "pycambia>=0.2.0",
    "pyimgbox>=1.0.7",
    "pyoxipng>=9.1.1",
    "pyperclip>=1.11.0",
    "qbittorrent-api>=2026.8.1",
    "requests>=2.34.2",
    "send2trash>=2.1.0",
    "tenacity>=9.1.4",
    "torf>=4.3.1",
    "tqdm>=4.70.0",
    "transmission-rpc>=7.0.12",
    "unidecode>=1.4.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
salmon = "salmon.run:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.12.11"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # flake8-type-checking
    "TC",
]

[tool.ruff.lint.per-file-ignores]
# run.py imports command modules for their side effects (registering CLI commands)
"src/salmon/run.py" = ["F401"]

[tool.pyright]
typeCheckingMode = "standard"
reportPossiblyUnboundVariable = "warning"
reportUnreachable = "warning"
reportInvalidCast = "warning"
reportUnsafeMultipleInheritance = "warning"
reportImplicitAbstractClass = "warning"
reportInvalidAbstractMethod = "warning"
reportPrivateImportUsage = "none"

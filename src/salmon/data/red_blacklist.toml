# RED (redacted.sh) upload blacklist — releases that must NOT be uploaded to RED.
# Source: RED "Do Not Upload" / Current Blacklist (Music), last updated 2024-06-07.
#
# This BLOCKS a RED upload when it matches (OPS uploads are unaffected).
# Matching is case- and punctuation-insensitive on whole words: every word in
# an entry's `artist` (and `album`, if given) must appear in the release.
#   - `artist` with no `album`  -> blocks that artist's whole discography
#   - `artist` + `album`        -> blocks only that release
#   - `label`                   -> blocks by record label
#
# Editable: remove an entry if RED de-lists it (their changelog shows removals),
# or add your own. If you have a legitimate copy of a blacklisted release, RED
# requires a StaffPM with proof before uploading.


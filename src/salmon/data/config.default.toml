# Smoked Salmon Configuration File
# Read details about each setting here:
# https://github.com/smokin-salmon/smoked-salmon/wiki/Configuration

# ===============================
# DIRECTORY SETTINGS
# ===============================
[directory]
# Where to copy files (usually the download/seeding folder for your torrent client)
download_directory = '.music'

# Hardlinks are enabled by default, set the option below to false to DISABLE hardlinks (and use standard copy files)
# hardlinks = true

# Read-only source libraries (e.g. a Lidarr-managed collection). Folders here can be
# browsed and uploaded from, and salmon never modifies or deletes them: an album chosen
# from a library is copied into download_directory before anything touches it. That copy
# is deliberate rather than a hardlink, since a hardlink shares the inode and the retagging
# step would write straight back into your library.
# library_dirs = ['/data/media/music']

# Can be a watch folder for your torrent client, or a folder somewhere else where the .torrent files will be generated
# You still need to have it set even if using direct torrent injection with qbittorrent
dottorrents_dir = '.torrents'

# Set the TMP dir where spectrals are made, e.g. on a fast disk. Unset, they go in the album's Spectrals folder, or in
# download_directory for a library album or an album that has a Spectrals folder of its own.
# tmp_dir = 'path to tmp dir'

# If True, clear stale scratch from the temporary directory at startup, so leftovers do not accumulate
# Only entries inside the TMP_DIR are removed, and only those untouched for 24 hours: every salmon
# command runs this, including one started while `salmon web` is serving, so anything recent may
# belong to that other process and is left alone
# clean_tmp_dir = true

# ===============================
# IMAGE UPLOAD SETTINGS
# ===============================
# Image hosters: ptscreens, oeimg, imgbb, catbox, imgbox, ra, red
# catbox and imgbox need no API key.
# ra (thesungod.xyz) is invite-only but images it hosts are public; it cannot be used as specs_uploader.
# red is RED's own host (uses tracker.red.api_key, else the session), for album artwork only: opt in under
# [image.red]; anywhere else ("red" for description images, spectrals, OPS/DIC) is refused.
[image]
image_uploader = "catbox"
cover_uploader = "catbox"
specs_uploader = "catbox"

# Default selection for "What spectral IDs would you like to upload?" prompt.
# "*" = all, "+" = randomized selection, "0" = none, or track IDs separated by spaces, such as "3" or "1 5 9"
# (IDs a release does not have are left out). Leave unset to use context-based default.
# default_spectral_ids = "3"

# catbox works without a key. Set your userhash (catbox.moe, My Account) to upload to your account.
# catbox_userhash = 'userhash'
# ptscreens API key (log into ptscreens, settings, API)
ptscreens_key = 'api_key'
# oeimg API key (log into imgoe, settings, API)
oeimg_key = 'api_key'
# imgbb API key (log into imgbb, about, API)
imgbb_key = 'api_key'
# ra API key (log into ra, settings, API keys)
ra_key = 'api_key'

# Set to true to remove downloaded cover images that are created in source folder, when one does not exist
# remove_auto_downloaded_cover_image = false

# Before a non-scene upload, FLACs whose pictures plus padding exceed 1 MiB (a trump reason) lose them, keeping
# the front cover as a file. Set to true to also embed that cover into FLACs carrying none, resized to fit.
# embed_missing_cover = false

# Per-tracker overrides, kept last: an [image.<tracker>] header takes every setting below it; unset keys use [image].
# A tracker's image_uploader is the default of `salmon images up -t <tracker>`; RED→OPS cross-uploads keep RED's images.
# [image.red]
# cover_uploader = "red"      # send RED covers to RED's own host
# [image.ops]
# cover_uploader = "imgbox"

# ===============================
# METADATA SERVICES
# ===============================
[metadata]
# Discogs API Token (from https://www.discogs.com/settings/developers)
discogs_token = 'discogs-token'

# Tidal (optional). Register a client at https://developer.tidal.com and copy its
# client ID and client secret here. The token used by Tidal's old API no longer works.
# [metadata.tidal]
# client_id = 'your-client-id'
# client_secret = 'your-client-secret'
# regions = ["de", "nz", "us", "gb"]

# Apple Music storefronts for searching and fetching metadata.
# All storefronts are searched in parallel; results are interleaved by rank.
# A single storefront can have multiple languages for fetching metadata tags.
# Format: "storefront:lang", e.g. "us:en-US", "jp:ja", "cn:zh-Hans-CN"
# [metadata.apple_music]
# storefronts = ["us:en-US", "jp:ja", "cn:zh-Hans-CN"]

# remove if not using qobuz
[metadata.qobuz]
app_id = 'app-id'
user_auth_token = 'user_auth_token'
# if you are using salmon from a non-english country, set this to true to avoid retrieving non-english genres
# no_genres_from_qobuz = false

# remove if not using beatport
[metadata.beatport]
username = 'username'
password = 'password'

# ===============================
# TRACKER SETTINGS
# ===============================
[tracker]
# Without -t, a run uploads to these in order, then offers the other trackers if upload.multi_tracker_upload is on.
# Not set: it asks which.
default_trackers = ['RED']
# Print every tracker request and response, with secrets masked
# debug_connection = false

# Authentication (Replace with valid session keys or API keys)
[tracker.red]
session = 'get-from-site-cookie' # Required for now (waiting on API support)
# keeplogged = 'optional-keep-me-logged-in-cookie' # Needed on some Gazelle sites when session alone loops to login
# api_key = 'red-api-key'          # Needs uploading privileges (optional for now)
# In case you want separate output folders for .torrent files
# dottorrents_dir = 'path to dir'

[tracker.ops]
session = 'get-from-site-cookie'
# keeplogged = 'optional-keep-me-logged-in-cookie'
# api_key = 'ops-api-key'          # Needs uploading privileges (optional for now)
# In case you want separate output folders for .torrent files
# dottorrents_dir = 'path to ops dir'

[tracker.dic]
session = 'get-from-site-cookie'
# keeplogged = 'optional-keep-me-logged-in-cookie'
# api_key = 'dic-api-key'          # DIC does not take API keys: ignored, with a warning
# In case you want separate output folders for .torrent files
# dottorrents_dir = 'path to dic dir'

# ===============================
# SEEDING SETTINGS
# ===============================
# [[seedbox]]
# name = ""
# enabled = true
# url = "nas" # Name of remote in rclone
# type = "local" # "local" or "rclone"
# flac_only = false # if true, only upload FLAC files
# extra_args = [ "--checksum", "-P", "--sftp-path-override", "@/volume3" ] # pass these arguments to rclone

# # transmission+http://username:password@127.0.0.1:9091
# # rutorrent+http://RUTORRENT_ADDRESS:9380/plugins/rpc/rpc.php
# # deluge://username:password@127.0.0.1:58664
# # qbittorrent+http://username:password@127.0.0.1:8080
# torrent_client = ""
# directory = "" # Directory when adding torrent to download client
# label = "smoked-salmon" # Label to apply to torrents in download client
# add_paused = false # If true, add torrents to client in paused state



name: Build Image (PR)

# Dockerfile and webui/ have no other CI cover — build-alpha.yml is push-to-master only.
on:
  pull_request:

jobs:
  build-image:
    runs-on: ubuntu-latest
    # Never add packages: write here. A same-repo PR branch can edit the workflow it
    # runs under, so registry credentials stay in build-alpha.yml (master pushes only).
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

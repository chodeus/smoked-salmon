name: Build Image (PR)

# Dockerfile and webui/ have no other CI cover — build-alpha.yml is push-to-master only.
on:
  pull_request:

jobs:
  build-image:
    runs-on: ubuntu-latest
    # Never add packages: write here. A same-repo PR branch can edit the workflow it
    # runs under, so registry credentials stay in build-alpha.yml (master pushes only).
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: smoked-salmon-scan:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image
        uses: ./.github/actions/scan-image
        with:
          image-ref: smoked-salmon-scan:${{ github.sha }}

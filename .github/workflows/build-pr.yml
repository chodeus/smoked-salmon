name: Build Image (PR)

# Dockerfile and webui/ have no other CI cover — build-alpha.yml is push-to-master only.
on:
  pull_request:

jobs:
  build-image:
    runs-on: ubuntu-latest
    # Never add packages: write here. A same-repo PR branch can edit the workflow it
    # runs under, so registry credentials stay in build-alpha.yml (master pushes only).
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: smoked-salmon-scan:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Two tiers on purpose: the report tier is the wide net and never blocks, the gate
      # tier is narrow and blocks. ignore-unfixed keeps an unfixable base-image CVE from
      # wedging every build until Debian ships a patch.
      - name: Scan image (report fixable HIGH and CRITICAL)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: image
          image-ref: smoked-salmon-scan:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: table
          output: trivy-report.txt

      - name: Publish scan report
        if: always()
        run: |
          {
            echo '### Image scan - fixable HIGH and CRITICAL'
            echo '```'
            cat trivy-report.txt 2>/dev/null || echo '(no report produced)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Scan image (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: image
          image-ref: smoked-salmon-scan:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          # The report step above already installed trivy in this job.
          skip-setup-trivy: true
